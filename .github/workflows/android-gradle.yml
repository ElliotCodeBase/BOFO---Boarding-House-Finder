# Native Android (bofo-android/) build. The old GluonFX workflow (android.yml) is left alone.
# Automatic: unit tests + debug APK on every push / PR that touches bofo-android/.
# Manual (Run workflow): also builds the signed release APK + AAB when the 4 secrets below exist.
# Secrets (Settings > Secrets and variables > Actions): BOFO_KEYSTORE_BASE64 (base64 of the .jks),
#   BOFO_KEYSTORE_PASSWORD, BOFO_KEY_ALIAS, BOFO_KEY_PASSWORD.
# Not run by Claude: first run may need small fixes (see bofo-android/docs/RELEASE.md).
name: Build Android (Gradle)

on:
  push:
    paths: ['bofo-android/**', '.github/workflows/android-gradle.yml']
  pull_request:
    paths: ['bofo-android/**', '.github/workflows/android-gradle.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Also build the signed release APK + AAB'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bofo-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: BOFO-android-debug
          path: bofo-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode keystore
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          KS_B64: ${{ secrets.BOFO_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS_B64" || { echo "Secret BOFO_KEYSTORE_BASE64 is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/bofo-release.jks"
          echo "BOFO_KEYSTORE_FILE=$RUNNER_TEMP/bofo-release.jks" >> "$GITHUB_ENV"

      - name: Release APK + AAB (signed)
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          BOFO_KEYSTORE_PASSWORD: ${{ secrets.BOFO_KEYSTORE_PASSWORD }}
          BOFO_KEY_ALIAS: ${{ secrets.BOFO_KEY_ALIAS }}
          BOFO_KEY_PASSWORD: ${{ secrets.BOFO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch' && inputs.release
        with:
          name: BOFO-android-release
          path: |
            bofo-android/app/build/outputs/apk/release/*.apk
            bofo-android/app/build/outputs/bundle/release/*.aab
            bofo-android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
