# Android: Google account picker inside the app (no browser). Paste the WEB client ID here (the same one that is in
# Supabase > Auth > Google). Leave empty to keep the browser sign-in. Setup steps: docs/NATIVE_GOOGLE_SIGNIN.md
google.webClientId=

# Map renderer: vector = BOFO's own style drawn from OpenFreeMap vector tiles (no key, commercial use allowed, sharp,
# no labels / shop icons; util/VectorTileRetriever). raster = the old picture tiles below (util/MinimalTileRetriever);
# it is also used per tile when a vector tile cannot be loaded.
map.renderer=vector
map.vector.tilejson=https://tiles.openfreemap.org/planet
map.attribution.vector=OpenFreeMap \u00A9 OpenMapTiles, data from OpenStreetMap

# Raster fallback: roads, water, parks and building shapes only (no labels, no shop / bus-stop icons).
# CARTO needs a free key (dashboard.basemaps.carto.com): put it in config.local.properties as map.tiles.key=YOUR_KEY.
# Without a key the app falls back to plain OpenStreetMap tiles (busier). Free CARTO keys are meant for non-commercial use:
# before charging for Boost plans, switch map.tiles.url to a plan you may use commercially (Mapbox, MapTiler, Stadia...).
map.tiles.url=https://basemaps.cartocdn.com/rastertiles/light_nolabels/{z}/{x}/{y}.png
map.tiles.key=
map.attribution=\u00A9 OpenStreetMap contributors \u00A9 CARTO

# Optional routing / commuter-data settings (all have defaults):
#   route.drive.url=...      road route service for tricycle / jeepney / van legs (OSRM format, like route.url)
#   transit.online=false     do not download jeepney lines from OpenStreetMap (fares and times become estimates)
#   transit.overpass=...     another Overpass API server for the jeepney lines

# App version shown in Profile > About. Bump this (and pom.xml <version>, <versionName>, <versionCode>) in EVERY pull request.
app.version=1.14.2

policy.terms.version=1.0
policy.privacy.version=1.0
policy.owner.version=1.0
# Optional: where users reach you about privacy / terms (email or text). Empty = "the BOFO team through the app".
policy.contact=

# DEV ONLY: skip Google login and open the app as a fake local user. Set to false before release!
dev.bypassLogin=true
# student | owner | admin
dev.role=student
