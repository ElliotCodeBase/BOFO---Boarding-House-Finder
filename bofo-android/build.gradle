// Top-level build file. Java-only app: no Kotlin plugin is applied.
plugins {
    id 'com.android.application' version '8.11.1' apply false
    // v2.3.0: push notifications. Applied in app/build.gradle ONLY when app/google-services.json exists, so the app still builds before Firebase is set up.
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
