# Non-secret tuning values read by AppConfig.get(...). The Supabase URL / anon key / Google web client ID / redirect
# are NOT here: app/build.gradle puts them into BuildConfig (from the desktop config.properties or local.properties).
# Optional routing / commuter-data settings (all have defaults in AppConfig):
#   route.url=...  route.drive.url=...  route.online=false  transit.online=false  transit.overpass=...
policy.terms.version=1.0
policy.privacy.version=1.0
policy.owner.version=1.0
# Optional: where users reach you about privacy / terms (email or text). Empty = "the BOFO team through the app".
policy.contact=

# Map lag test (v2.0.40). vector = normal (default). raster = ready-made picture tiles, like the JavaFX app (TEST: OpenStreetMap tiles).
# off = no map at all (shows whether the lag comes from the map or from the rest of the Home screen). Rebuild after changing it.
map.mode=vector
