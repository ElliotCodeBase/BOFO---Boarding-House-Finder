plugins {
    id 'com.android.application'
}

// Public config comes from the desktop app's config.properties (same Supabase project), and
// local.properties (git-ignored, optional) overrides it. Never put a service_role key anywhere.
def cfgProps = new Properties()
[rootProject.file('../src/main/resources/com/bofo/finder/config.properties'),
 rootProject.file('local.properties')].each { f ->
    if (f.exists()) f.withInputStream { cfgProps.load(it) }
}
def cfg = { String k -> (cfgProps.getProperty(k) ?: '').trim().replace('\\', '\\\\').replace('"', '\\"') }

// Stage 9: release signing. Values come from bofo-android/keystore.properties (git-ignored, see
// keystore.properties.example) or from the environment (BOFO_KEYSTORE_FILE / _PASSWORD / BOFO_KEY_ALIAS /
// BOFO_KEY_PASSWORD, used by the GitHub workflow). Without a key, assembleRelease still works but the
// APK is UNSIGNED (cannot be installed). The keystore itself is never committed.
def keystoreProps = new Properties()
rootProject.file('keystore.properties').with { f ->
    if (f.exists()) f.withInputStream { keystoreProps.load(it) }
}
def ks = { String k, String env -> (keystoreProps.getProperty(k) ?: System.getenv(env) ?: '').trim() }
def releaseStorePath = ks('storeFile', 'BOFO_KEYSTORE_FILE')
def hasReleaseKey = releaseStorePath && rootProject.file(releaseStorePath).exists()

android {
    namespace 'com.bofo.finder'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bofo.finder'
        minSdk 26
        targetSdk 36
        // Version rule: stage N = v2.0.N, versionCode = 200 + N. Bump in EVERY stage / pull request.
        versionCode 236
        versionName '2.0.36'

        buildConfigField 'String', 'SUPABASE_URL', "\"${cfg('supabase.url')}\""
        buildConfigField 'String', 'SUPABASE_ANON_KEY', "\"${cfg('supabase.anonKey')}\""
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', "\"${cfg('google.webClientId')}\""
        buildConfigField 'String', 'AUTH_REDIRECT', "\"${cfg('auth.redirect.android') ?: 'bofo://auth-callback'}\""
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile rootProject.file(releaseStorePath)
                storePassword ks('storePassword', 'BOFO_KEYSTORE_PASSWORD')
                keyAlias ks('keyAlias', 'BOFO_KEY_ALIAS')
                keyPassword ks('keyPassword', 'BOFO_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true        // Stage 9: R8 (shrink + obfuscate), rules in proguard-rules.pro
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true   // android.jar stubs return defaults instead of throwing in plain JVM tests
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Stage 3: Google sign-in (Credential Manager), profile photo (EXIF rotation, image loading)
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Stage 4: list screens (grid, pull to refresh, photo pager)
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Stage 5: map (MapLibre Native, Vulkan renderer by default from 13.0.0) + location
    implementation 'org.maplibre.gl:android-sdk:13.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Stage 8g: Boost checkout opens in a Custom Tab
    implementation 'androidx.browser:browser:1.8.0'

    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is a stub in unit tests: use the real library there
    testImplementation 'org.json:json:20240303'
}
