pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'BOFO'
include ':app'

// Stage 3: the shared library and the new admin app live next to bofo-android/ (repo root). The main app does not depend on them yet.
include ':shared'
project(':shared').projectDir = file('../shared')
include ':app-admin'
project(':app-admin').projectDir = file('../app-admin')
